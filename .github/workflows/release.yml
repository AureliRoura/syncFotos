name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
            echo "Using tag version: ${SETUPTOOLS_SCM_PRETEND_VERSION}"
          fi
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-packages:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check if minor version changed
        id: minor_check
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CURRENT_MINOR="${TAG#*.}"
          CURRENT_MINOR="${CURRENT_MINOR%%.*}"

          PREV_TAG="$(git tag --sort=-version:refname --list 'v[0-9]*' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"

          if [ -z "${PREV_TAG}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_TAG_NO_V="${PREV_TAG#v}"
          PREV_MINOR="${PREV_TAG_NO_V#*.}"
          PREV_MINOR="${PREV_MINOR%%.*}"

          if [ "${CURRENT_MINOR}" != "${PREV_MINOR}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.minor_check.outputs.publish == 'true'
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TWINE_REPOSITORY_URL: https://pypi.pkg.github.com/${{ github.repository_owner }}
        shell: bash
        run: |
          python -m pip install --upgrade twine
          python -m twine upload dist/*
